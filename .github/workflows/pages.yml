name: Publicar leitor no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_pages_artifact.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio publico
        uses: actions/checkout@v4

      - name: Verificar a allowlist do conteudo publico
        run: python scripts/validate_pages_artifact.py site

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar somente o leitor estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
